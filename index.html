<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<title>100</title>
<style>
:root{
  --bg:#000000; --surface:#141416; --surface-2:#1E1E22;
  --soft:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.22);
  --text:#FFFFFF; --dim:rgba(235,235,245,.58); --faint:rgba(235,235,245,.28);
  --accent:#FFB340; --on-accent:#1A1200; --green:#34C759; --red:#FF453A; --blue:#5AC8FA;
  --ring:#FFFFFF; --tip-bg:#25252A;
  --card-hi:rgba(255,255,255,.055); --card-grad:rgba(255,255,255,.035); --glow-op:.55;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.64,1); --pad:20px;
}
html[data-theme=light]{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EDEDF2;
  --soft:rgba(0,0,0,.055); --stroke:rgba(0,0,0,.2);
  --text:#000000; --dim:rgba(60,60,67,.62); --faint:rgba(60,60,67,.32);
  --ring:#000000; --tip-bg:#FFFFFF; --green:#28A745; --blue:#0A84FF;
  --card-hi:rgba(255,255,255,.9); --card-grad:rgba(0,0,0,.015); --glow-op:.5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{transition:background .4s}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  font-optical-sizing:auto;font-feature-settings:"cv11","tnum";
  font-size:17px;line-height:1.4;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;transition:background .4s,color .3s;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg);transition:background .4s}
#bg::after{content:"";position:absolute;inset:0;opacity:var(--glow-op);
  background:
    radial-gradient(70vmax 70vmax at 10% -12%, color-mix(in srgb,var(--glow,#6E6E80) 60%,transparent), transparent 62%),
    radial-gradient(50vmax 50vmax at 105% 28%, color-mix(in srgb,var(--accent) 38%,transparent), transparent 62%)}
#app{position:relative;z-index:1}
html,body{background:var(--bg)}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;letter-spacing:inherit}
button{cursor:pointer}
.shell{max-width:480px;margin:0 auto;padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 56px)}

/* вхід */
#gate{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
#gate.hide{opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.gate-in{width:100%;max-width:300px;text-align:center;animation:rise .8s var(--ease) both}
.gate-mark{font-size:84px;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--accent);margin-bottom:8px}
.gate-sub{color:var(--dim);font-size:15px;margin-bottom:38px}
.nick{width:100%;text-align:center;font-size:22px;font-weight:600;padding:16px 12px;background-color:var(--surface);
  border-radius:16px;border:1.5px solid transparent;transition:border-color .25s var(--ease)}
.nick:focus{border-color:var(--accent)}
.nick::placeholder{color:var(--faint);font-weight:400}
.nick:-webkit-autofill,.nick:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);
  -webkit-box-shadow:0 0 0 1000px var(--surface) inset;caret-color:var(--text);transition:background-color 9999s}
.go{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:var(--accent);color:var(--on-accent);
  font-weight:600;font-size:17px;transition:transform .25s var(--spring)}
.go:active{transform:scale(.97)}
.build{margin-top:22px;font-size:11px;color:var(--faint)}

/* оверлей */
#fact{position:fixed;inset:0;z-index:55;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  display:flex;flex-direction:column;overflow-y:auto;padding:32px 28px;transition:opacity .45s var(--ease)}
#fact.hide{opacity:0;pointer-events:none}
.fact-in{max-width:340px;width:100%;margin:auto;text-align:center;animation:rise .8s var(--ease) .1s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fact-n{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:26px}
.fact-t{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-bottom:14px}
.fact-t.big{font-size:72px;letter-spacing:-.06em;color:var(--accent)}
.fact-s{font-size:17px;color:var(--dim);line-height:1.5;margin-bottom:36px;text-wrap:pretty}
.fact-go{padding:14px 40px;border-radius:14px;background:var(--surface-2);font-size:16px;font-weight:550;transition:transform .25s var(--spring)}
.fact-go:active{transform:scale(.96)}
.wk{display:flex;gap:7px;justify-content:center;margin:2px 0 22px}
.wk i{width:28px;height:28px;border-radius:7px;display:block;background:var(--soft)}
.stat{font-size:15px;color:var(--dim);line-height:1.7}
.stat b{color:var(--text);font-weight:600}
#confetti{position:fixed;inset:0;z-index:58;pointer-events:none}
#confetti i{position:absolute;width:8px;height:12px;border-radius:2px}

/* шапка */
.hdr{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 26px;
  background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 82%,transparent) 60%,transparent 100%);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  -webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.hdr-in{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.today{font-size:15px;color:var(--dim)}
.who{font-size:15px;color:var(--faint);display:flex;align-items:center;gap:12px}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);background:var(--soft);
  transition:transform .3s var(--spring),background .3s}
.ib:active{transform:scale(.9)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(118,118,128,.16);border-radius:11px;padding:2px}
.seg-pill{position:absolute;top:2px;bottom:2px;width:calc((100% - 4px)/4);background:var(--surface-2);
  border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:transform .42s var(--spring)}
.seg button{position:relative;z-index:1;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--dim);transition:color .3s}
.seg button[aria-selected="true"]{color:var(--text)}

.panel{display:none;padding-top:6px}
.panel.on{display:block;animation:fwd .42s var(--ease)}
.panel.on.back{animation:bwd .42s var(--ease)}
@keyframes fwd{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes bwd{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* челендж */
.count{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.count b{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:.86;
  background:linear-gradient(180deg,var(--text) 30%,var(--dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.count span{font-size:15px;color:var(--dim);align-self:flex-end;padding-bottom:4px;margin-left:-4px}
.ring{width:56px;height:56px;margin-left:6px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .8s var(--ease),stroke .5s}
.streak{margin-left:auto;text-align:right}
.streak b{display:inline-block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--green);
  text-shadow:0 0 18px color-mix(in srgb,var(--green) 55%,transparent)}
.streak b.pop{animation:pop .5s var(--spring)}
.streak i{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-top:4px}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px;padding:3px}
.cell{position:relative;aspect-ratio:1;border-radius:5px;background:var(--soft);overflow:hidden;padding:0;
  transition:transform .25s var(--spring),box-shadow .5s var(--ease)}
.cell .fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .6s var(--ease),background .4s}
.cell.zero{background:rgba(255,69,58,.16)}
.cell.future{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.cell.rest{background:repeating-linear-gradient(135deg,var(--soft) 0 3px,transparent 3px 7px)}
.cell:hover{transform:scale(1.2);z-index:2}
.cell.today{outline:2px solid var(--ring);outline-offset:2.5px;animation:breathe 2.8s ease-in-out infinite}
.cell.enter{animation:cellIn .55s var(--ease) both}
.cell.today.enter{animation:cellIn .55s var(--ease) both,breathe 2.8s ease-in-out .6s infinite}
.cell.wave{animation:wave .55s var(--spring) both}
.cell.today.wave{animation:wave .55s var(--spring) both,breathe 2.8s ease-in-out .6s infinite}
@keyframes breathe{0%,100%{outline-color:var(--ring)}50%{outline-color:color-mix(in srgb,var(--ring) 35%,transparent)}}
@keyframes cellIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes wave{0%{transform:scale(1)}45%{transform:scale(1.34)}100%{transform:scale(1)}}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-bottom:6px}
.legend .bar{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,hsl(4 76% 48%),hsl(45 90% 52%),hsl(142 62% 46%))}
.share-row{display:flex;justify-content:flex-end;margin-bottom:22px}
.share-row button{font-size:13px;color:var(--accent);font-weight:550;display:flex;align-items:center;gap:6px}
.share-row svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* рядки */
.h{font-size:13px;color:var(--faint);margin:0 0 10px 2px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.h button{font-size:13px;color:var(--accent);font-weight:550}
.card,.week,.task,.dayrow,.daybar,.note,.goal-add input,.sheet,.rowbtn,.datarow button,.nick,.kpi,.srow{
  background-image:linear-gradient(180deg,var(--card-grad),transparent 55%);box-shadow:inset 0 1px 0 var(--card-hi)}
.task{display:flex;align-items:center;gap:13px;padding:15px 16px;background-color:var(--surface);border-radius:16px;margin-bottom:8px;
  transition:transform .3s var(--spring),background .25s}
.task:active{transform:scale(.985);background-color:var(--surface-2)}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--stroke);display:grid;place-items:center;
  transition:background .3s var(--ease),border-color .3s var(--ease)}
.task.done .box{background:var(--green);border-color:var(--green);animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.24)}100%{transform:scale(1)}}
.box svg{width:15px;height:15px;stroke:#04140A;stroke-width:2.9;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s var(--ease) .06s}
.task.done .box svg{stroke-dashoffset:0}
.emo{flex:none;width:22px;text-align:center;font-size:18px;line-height:1}
.task-name{flex:1;font-size:16px;transition:color .3s;min-width:0}
.task.done .task-name{color:var(--dim)}
.task-streak{font-size:13px;color:var(--faint);flex:none}
.tools{display:none;gap:3px;flex:none}
.editing .tools{display:flex}
.editing .task-streak,.editing .box{display:none}
.tools button{width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--dim);font-size:15px;line-height:1;
  display:grid;place-items:center;transition:transform .2s var(--spring)}
.tools button:active{transform:scale(.9)}
.rowbtn{width:100%;padding:14px;border-radius:16px;background-color:var(--surface);color:var(--dim);font-size:15px;margin-top:4px;transition:transform .3s var(--spring)}
.rowbtn:active{transform:scale(.985)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background-color:var(--surface);border-radius:16px;margin-bottom:8px}
.switch small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.tog{width:50px;height:30px;border-radius:15px;background:var(--soft);position:relative;transition:background .3s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.tog.on{background:var(--blue)}
.tog.on::after{transform:translateX(20px)}

/* оцінка */
.daybar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background-color:var(--surface);border-radius:14px;margin-bottom:22px;font-size:15px}
.daybar button{color:var(--accent);font-size:14px;font-weight:550}
.mood{display:flex;align-items:flex-end;gap:6px;height:120px;margin-bottom:8px}
.mood button{flex:1;border-radius:7px;background:var(--soft);transition:background .35s var(--ease),transform .3s var(--spring)}
.mood button:active{transform:scaleY(1.05)}
.mood-val{display:flex;justify-content:space-between;color:var(--faint);font-size:13px;margin-bottom:28px}
.mood-val b{color:var(--text);font-size:15px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tag{padding:9px 15px;border-radius:20px;background:var(--surface);font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px;
  transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--spring)}
.tag:active{transform:scale(.94)}
.tag.on{background:var(--accent);color:var(--on-accent);font-weight:550}
.tag .x{display:none;font-size:16px;line-height:1;opacity:.6}
.tags.editing .x{display:inline}
.note{width:100%;min-height:110px;padding:16px;background-color:var(--surface);border-radius:16px;font-size:16px;resize:none;line-height:1.5;margin-bottom:8px}
.note::placeholder{color:var(--faint)}

/* дні */
.week{padding:14px 16px;border-radius:16px;background-color:var(--surface);margin-bottom:8px}
.week-top{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-bottom:10px}
.week-top b{color:var(--text);font-weight:600}
.week-row{display:flex;gap:6px}
.week-row i{flex:1;aspect-ratio:1;border-radius:6px;background:var(--soft);display:block;transition:background .4s}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background-color:var(--surface);border-radius:14px;margin-bottom:7px;width:100%;text-align:left;transition:transform .3s var(--spring)}
.dayrow:active{transform:scale(.985)}
.dayrow .n{flex:none;width:34px;font-size:13px;color:var(--faint)}
.dayrow .d{flex:none;width:78px;font-size:14px;color:var(--dim)}
.dayrow .track{flex:1;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.dayrow .track i{display:block;height:100%;border-radius:4px;transition:width .5s var(--ease)}
.dayrow .m{flex:none;width:34px;text-align:right;font-size:13px;color:var(--faint)}

/* стата */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}
.kpi{padding:14px 12px;border-radius:16px;background-color:var(--surface)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:6px}
.kpi span{font-size:12px;color:var(--faint)}
.spark{width:100%;height:90px;display:block;margin-bottom:6px}
.spark-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:28px}
.srow{background-color:var(--surface);border-radius:16px;margin-bottom:8px;overflow:hidden}
.srow-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.srow-h .emo{width:22px}
.srow-h .nm{flex:1;font-size:15px;min-width:0}
.srow-h .pct{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.srow-bar{height:4px;margin:0 16px 12px;border-radius:2px;background:var(--soft);overflow:hidden}
.srow-bar i{display:block;height:100%;border-radius:2px}
.mini{display:none;grid-template-columns:repeat(10,1fr);gap:3px;padding:4px 16px 16px}
.srow.open .mini{display:grid}
.mini i{aspect-ratio:1;border-radius:3px;background:var(--soft);display:block}
.corr{font-size:14px;color:var(--dim);padding:0 16px 14px;line-height:1.5}
.corr b{color:var(--text)}
.corr .up{color:var(--green)} .corr .dn{color:var(--red)}
.tagbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.tagbar .t{width:110px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagbar .b{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.tagbar .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tagbar .c{width:26px;text-align:right;color:var(--faint);font-size:13px}

/* цілі */
.goal-add{display:flex;gap:8px;margin-bottom:12px}
.goal-add input{flex:1;padding:14px 16px;background-color:var(--surface);border-radius:15px;font-size:15px}
.goal-add input::placeholder{color:var(--faint)}
.goal-add button{flex:none;width:50px;border-radius:15px;background:var(--accent);color:var(--on-accent);font-size:24px;transition:transform .25s var(--spring)}
.goal-add button:active{transform:scale(.92)}
.gsec{margin-bottom:30px}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:20px;line-height:1.5}
.datarow{display:flex;gap:8px}
.datarow button{flex:1;padding:13px;border-radius:14px;background-color:var(--surface);color:var(--dim);font-size:14px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:70}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .32s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background-color:var(--surface);
  border-radius:22px 22px 0 0;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .46s var(--spring)}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 16px;opacity:.6}
.sheet-t{font-size:13px;color:var(--faint);margin:0 0 10px 2px;font-weight:500}
.sheet-fields{display:flex;gap:8px;margin-bottom:12px}
.sheet-in{flex:1;font-size:19px;font-weight:550;padding:14px 16px;background:var(--surface-2);border-radius:14px;min-width:0}
.sheet-ex{width:64px;text-align:center;font-size:22px;padding:14px 0;background:var(--surface-2);border-radius:14px}
.sheet-row{display:flex;gap:8px}
.sheet-del{flex:1;padding:14px;border-radius:14px;background:rgba(255,69,58,.14);color:var(--red);font-weight:550;transition:transform .25s var(--spring)}
.sheet-ok{flex:2;padding:14px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;transition:transform .25s var(--spring)}
.sheet-del:active,.sheet-ok:active{transform:scale(.96)}
@media (min-width:600px){
  .sheet{bottom:auto;top:50%;border-radius:22px;transform:translateY(-40%) scale(.96);opacity:0;transition:transform .4s var(--spring),opacity .3s}
  .sheet-wrap.open .sheet{transform:translateY(-50%);opacity:1}
  .sheet-grab{display:none}
}

#tip{position:fixed;z-index:40;background:var(--tip-bg);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.45;
  box-shadow:0 12px 34px rgba(0,0,0,.35);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .22s var(--ease);max-width:220px}
#tip.show{opacity:1;transform:none}
#tip b{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
#tip .r{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip .r.y{color:var(--green)}
/* перемикач режимів у шапці */
.who{gap:10px}
.mswitch{position:relative;display:flex;background:rgba(118,118,128,.16);border-radius:17px;padding:2px}
.mswitch[hidden]{display:none}
.mswitch .th{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:15px;background:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .45s var(--spring),width .45s var(--spring)}
.mswitch .th.still{transition:none}
.mswitch button{position:relative;z-index:1;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim);
  white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .3s}
.mswitch button.on{color:var(--bg)}
.mswitch button i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);
  transform:scale(0);transition:transform .35s var(--spring)}
.mswitch button.full i{transform:scale(1)}
@media (max-width:380px){ .today .wd{display:none} .mswitch button{padding:6px 10px} }
/* режими */
.modes{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;padding:7px 15px;border-radius:18px;background:var(--surface);font-size:14px;font-weight:550;color:var(--dim);
  box-shadow:inset 0 1px 0 var(--card-hi);transition:background .3s var(--ease),color .3s,transform .25s var(--spring)}
.mode:active{transform:scale(.94)}
.mode.on{background:var(--text);color:var(--bg)}
.mode.add{width:34px;padding:7px 0;text-align:center}
.suggest{padding:18px 16px;border-radius:16px;background-color:var(--surface);box-shadow:inset 0 1px 0 var(--card-hi);margin-bottom:8px}
.suggest p{margin:0 0 12px;font-size:15px;color:var(--dim);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:18px;background:var(--surface-2);font-size:14px;color:var(--text);transition:transform .25s var(--spring)}
.chip:active{transform:scale(.94)}

/* аватар і профіль */
.avatar{width:30px;height:30px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:14px;font-weight:750;
  color:#1A1200;background:linear-gradient(140deg,#FFD27A,var(--accent) 45%,#FF7A59);transition:transform .3s var(--spring)}
.avatar:active{transform:scale(.9)}
.avatar.dot::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.prof-hero{display:flex;align-items:center;gap:16px;margin:4px 0 22px}
.prof-hero .avatar{width:68px;height:68px;font-size:30px;flex:none}
.prof-hero b{display:block;font-size:26px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.prof-hero span{font-size:14px;color:var(--dim)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:30px}
.ach{padding:14px 8px 12px;border-radius:16px;background-color:var(--surface);box-shadow:inset 0 1px 0 var(--card-hi);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden}
.ach .e{font-size:30px;line-height:1.1}
.ach .t{font-size:13px;font-weight:600;line-height:1.2}
.ach .d{font-size:11px;color:var(--faint);line-height:1.3}
.ach.lock .e{filter:grayscale(1);opacity:.35}
.ach.lock .t{color:var(--dim)}
.ach.got{background-image:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.ach.got[data-tier]{background-image:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--tier) 30%,transparent),transparent 72%)}
.ach[data-tier="1"]{--tier:#D08A4E} .ach[data-tier="2"]{--tier:#B9C4D0} .ach[data-tier="3"]{--tier:#FFC940}
.ach.got[data-tier] .t{color:color-mix(in srgb,var(--tier) 70%,var(--text))}
.hach-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 8px 2px}
.hach-h small{font-size:12px;font-weight:500;color:var(--faint);margin-left:auto}
.ach .pb{width:70%;height:3px;border-radius:2px;background:var(--soft);margin-top:3px;overflow:hidden}
.ach .pb i{display:block;height:100%;background:var(--accent);border-radius:2px}
.ach-t{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:-6px 0 8px;color:var(--text)}
.pcard{padding:16px;border-radius:16px;background-color:var(--surface);box-shadow:inset 0 1px 0 var(--card-hi);margin-bottom:8px}
.pcard p{margin:0 0 10px;font-size:14px;color:var(--dim);line-height:1.5}
.pcard p:last-child{margin-bottom:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px}
.prow+.prow{box-shadow:0 -1px 0 var(--soft)}
.prow small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.prow select,.prow input{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--text);max-width:52%;
  -webkit-appearance:none;appearance:none;text-align:right}
.prow input{width:96px}
.prow .edit{color:var(--accent);font-size:14px;font-weight:550}
.pbtn{width:100%;padding:14px;border-radius:14px;background-color:var(--surface);box-shadow:inset 0 1px 0 var(--card-hi);
  font-size:15px;font-weight:550;margin-bottom:8px;transition:transform .25s var(--spring)}
.pbtn:active{transform:scale(.98)}
.pbtn.red{color:var(--red)}
.pbtn.acc{color:var(--accent)}
.live{display:flex;gap:8px;margin-bottom:12px}
.live div{flex:1;padding:12px;border-radius:12px;background:var(--surface-2)}
.live b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.live span{font-size:12px;color:var(--faint)}
details.how{margin-top:6px}
details.how summary{font-size:14px;color:var(--accent);font-weight:550;cursor:pointer;list-style:none;padding:6px 0}
details.how summary::-webkit-details-marker{display:none}
details.how ol{margin:10px 0 4px;padding-left:20px;font-size:14px;color:var(--dim);line-height:1.55}
details.how li{margin-bottom:6px}
details.how li b{color:var(--text);font-weight:600}
.code{position:relative;margin:8px 0 12px}
.code pre{margin:0;padding:12px 12px 12px;border-radius:12px;background:var(--surface-2);font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
  color:var(--dim);white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto}
.code button{position:absolute;top:8px;right:8px;padding:5px 10px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600}
.arch{padding:14px 16px;border-radius:16px;background-color:var(--surface);box-shadow:inset 0 1px 0 var(--card-hi);margin-bottom:8px}
.arch-top{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-bottom:10px}
.arch-top b{color:var(--text);font-weight:600}
.arch .mini{display:grid;padding:0;grid-template-columns:repeat(20,1fr);gap:2px}
.arch .mini i{border-radius:2px}
.sheet-d{font-size:15px;color:var(--dim);line-height:1.5;margin:-2px 2px 14px}
.sheet-ok.red{background:var(--red);color:#fff}

.sync{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-size:12px;color:var(--faint);opacity:0;transition:opacity .4s;pointer-events:none}
.sync.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-in">
    <div class="gate-mark">100</div>
    <div class="gate-sub">Сто днів, одна сітка</div>
    <input class="nick" id="nick" placeholder="нік" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="go" id="enter">Увійти</button>
    <div class="build">build 23</div>
  </div>
</div>

<div id="fact" class="hide" hidden>
  <div class="fact-in">
    <div class="fact-n" id="factN"></div>
    <div class="fact-t" id="factT"></div>
    <div class="fact-s" id="factS"></div>
    <button class="fact-go" id="factGo">Почати день</button>
  </div>
</div>
<div id="confetti"></div>

<div id="bg"></div>
<div id="app" hidden>
  <div class="hdr"><div class="hdr-in">
    <div class="top">
      <div class="today" id="date"></div>
      <div class="who">
        <div class="mswitch" id="mswitch" role="tablist" aria-label="Режим"></div>
        <button class="avatar" id="who" aria-label="Профіль"></button></div>
    </div>
    <div class="seg" role="tablist">
      <div class="seg-pill" id="pill"></div>
      <button role="tab" aria-selected="true" data-t="0">Челендж</button>
      <button role="tab" aria-selected="false" data-t="1">Дні</button>
      <button role="tab" aria-selected="false" data-t="2">Стата</button>
      <button role="tab" aria-selected="false" data-t="3">Цілі</button>
    </div>
  </div></div>

  <div class="shell">
  <section class="panel on" data-p="0">
    <div class="count">
      <b id="dayNum">1</b><span>зі 100</span>
      <div class="streak"><b id="streakNum">0</b><i>днів поспіль</i></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span>0</span><div class="bar"></div><span>усе</span></div>
    <div class="share-row"><button id="share"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M7 8l5-5 5 5"/></svg>Картинка для сторіс</button></div>
    <div id="todayBlock"></div>
  </section>

  <section class="panel" data-p="1">
    <p class="h">Цей тиждень</p>
    <div id="weekStrip"></div>
    <div id="todayRating" style="margin-top:30px"></div>
    <p class="h" style="margin-top:34px">Історія</p>
    <div id="days"></div>
  </section>

  <section class="panel" data-p="2">
    <div id="stats"></div>
  </section>

  <section class="panel" data-p="3">
    <div class="gsec"><p class="h">На тиждень</p>
      <div class="goal-add"><input data-k="short" placeholder="Коротка ціль"><button data-k="short">+</button></div><div id="g-short"></div></div>
    <div class="gsec"><p class="h">На місяць</p>
      <div class="goal-add"><input data-k="mid" placeholder="Середня ціль"><button data-k="mid">+</button></div><div id="g-mid"></div></div>
    <div class="gsec"><p class="h">На 100 днів</p>
      <div class="goal-add"><input data-k="long" placeholder="Велика ціль"><button data-k="long">+</button></div><div id="g-long"></div></div>
  </section>

  <section class="panel" data-p="4">
    <div class="daybar"><button id="back">← Історія</button><span id="selLabel"></span></div>
    <div id="detailHabits"></div>
    <div id="detailRating"></div>
  </section>

  <section class="panel" data-p="5">
    <div class="daybar"><button id="profBack">← Назад</button><span>Профіль</span></div>
    <div id="profTop"></div>
    <div class="gsec"><p class="h">Дані</p>
      <div class="datarow"><button id="exp">Експорт</button><button id="imp">Імпорт</button><input type="file" id="impFile" accept="application/json" hidden></div></div>
    <div id="profArchive"></div>
    <div class="gsec">
      <button class="pbtn red" id="restart">Почати челендж заново</button>
      <button class="pbtn" id="logout">Вийти з ніка</button>
    </div>
  </section>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg"></div>

    <div class="sheet-grab"></div>

    <div class="sheet-row"><button class="sheet-del" id="sheetDel">Видалити</button><button class="sheet-ok" id="sheetOk">Зберегти</button></div>
  </div>
</div>

<script>
const FACTS = [
{t:"Ван Гог", s:"Узяв пензель у 27 і за десять років зробив близько 2100 робіт. За життя визнання майже не мав."},
{t:"Джоан Роулінг", s:"Рукопис про Гаррі Поттера відхилив десяток видавництв. Bloomsbury узяв його після того, як перший розділ прочитала восьмирічна донька директора."},
{t:"Стівен Кінг", s:"Викинув чернетку «Керрі» у смітник. Дружина Табіта дістала її й попросила дописати."},
{t:"Джеймс Дайсон", s:"Зібрав 5127 прототипів пилососа, перш ніж вийшов той, що працював як треба."},
{t:"Мігель де Сервантес", s:"П'ять років провів у полоні в Алжирі, потім сидів у борговій в'язниці. Перший том «Дон Кіхота» вийшов, коли йому було 57."},
{t:"Лора Інґоллз Вайлдер", s:"Видала першу книжку у 65. Далі написала ще вісім."},
{t:"Момофуку Андо", s:"Винайшов локшину швидкого приготування у 48, у сараї на власному подвір'ї, після року щоденних спроб."},
{t:"Рей Крок", s:"Продавав апарати для молочних коктейлів, коли у 52 вперше побачив ресторан братів Макдональдів."},
{t:"Стів Джобс", s:"Його звільнили з компанії, яку він заснував, у 30. Повернувся через дванадцять років."},
{t:"Волт Дісней", s:"У 21 збанкрутував із першою студією Laugh-O-Gram і поїхав у Голлівуд з валізою малюнків."},
{t:"Опра Вінфрі", s:"Її зняли з посади ведучої вечірніх новин і перевели на денне ток-шоу — формат, у якому вона стала найвідомішою в світі."},
{t:"Майкл Джордан", s:"Не потрапив до основного складу шкільної команди й цілий сезон грав за другий."},
{t:"Ейнштейн і математика", s:"Він її не провалював. У 16 не склав вступний іспит до Цюрихського політехнікуму через мови й природничі, довчився рік і вступив."},
{t:"Стівен Гокінґ", s:"Діагноз у 21 і прогноз на два роки життя. Прожив ще 55 і встиг переписати уявлення про чорні діри."},
{t:"Роджер Баністер", s:"У 1954 пробіг милю швидше чотирьох хвилин, що вважалося неможливим. Через 46 днів рекорд побили."},
{t:"Дік Фосбері", s:"Виграв Олімпіаду 1968, стрибаючи через планку спиною вперед. З нього сміялися; сьогодні так стрибають усі."},
{t:"Джулія Чайлд", s:"Навчилася готувати у 37, видала першу книжку у 49, вийшла в телеефір у 51."},
{t:"Морґан Фріман", s:"Першу велику кінороль отримав у 50, до того грав у театрі та дитячій телепрограмі."},
{t:"Енг Лі", s:"Шість років сидів удома без роботи, поки дружина утримувала родину. Потім зняв фільми, що принесли йому два «Оскари» за режисуру."},
{t:"Хаяо Міядзакі", s:"Заснував студію Ghibli у 44, коли більшість аніматорів його віку вже керували чужими проєктами."},
{t:"Віра Ванг", s:"Не потрапила в олімпійську збірну з фігурного катання, двадцять років пропрацювала у Vogue і відкрила власний бренд у 40."},
{t:"Марія Склодовська-Кюрі", s:"Вчилася в підпільному «летючому університеті» у Варшаві, бо жінок не брали. Дві Нобелівські премії з різних наук."},
{t:"Бетховен", s:"Почав глухнути у 26. Дев'яту симфонію дописав, уже не чуючи жодної ноти."},
{t:"Анрі Матісс", s:"Після операції не міг стояти за мольбертом і почав вирізати композиції з кольорового паперу. Ці вирізки стали окремою епохою в його творчості."},
{t:"Клод Моне", s:"Писав «Латаття» з катарактою, майже не розрізняючи кольори. Полотна цього періоду вважають одними з найсильніших у нього."},
{t:"Фріда Кало", s:"Почала малювати в ліжку після аварії, з дзеркалом, закріпленим над головою."},
{t:"Вілма Рудольф", s:"У дитинстві перехворіла на поліомієліт і ходила в ортезі. У 1960-му взяла три золоті медалі Олімпіади в Римі."},
{t:"Малала Юсафзай", s:"Отримала Нобелівську премію миру у 17 — наймолодшою лауреаткою за всю історію."},
{t:"Тарас Шевченко", s:"До 24 років був кріпаком. Його викупили за гроші від лотереї, у якій розіграли портрет Жуковського."},
{t:"Катерина Білокур", s:"Ніколи не вчилася малювати. Пензлі робила з котячої шерсті, фарби готувала сама, полотно натягувала на саморобний підрамник."},
{t:"Архип Куїнджі", s:"Двічі провалив вступ до Академії мистецтв. Прийняли з третього разу."},
{t:"Соломія Крушельницька", s:"Після провалу прем'єри «Мадам Батерфляй» Пуччіні переписав оперу, і саме вона заспівала нову редакцію. Опера стала класикою."},
{t:"Ігор Сікорський", s:"Його перші гелікоптери не відривалися від землі. Робочу машину він підняв у повітря майже через тридцять років."},
{t:"Сергій Бубка", s:"Встановив 35 світових рекордів, щоразу піднімаючи планку на один сантиметр."},
{t:"Ліна Костенко", s:"Шістнадцять років її не друкували, бо вона не пішла на компроміс. Усі ці роки писала в шухляду."},
{t:"Леся Українка", s:"Хворіла з дванадцяти років і більшість творів писала лежачи. Володіла близько десятьма мовами."},
{t:"Марія Приймаченко", s:"Не мала жодної художньої освіти й прожила все життя в селі Болотня. Її виставки об'їхали Європу."},
{t:"Іван Пулюй", s:"Досліджував катодні промені й робив знімки ще до того, як про них оголосив Рентген."},
{t:"Барбара Мак-Клінток", s:"Її відкриття 1940-х наукова спільнота проігнорувала. Нобелівську премію вона отримала у 81, коли інші дійшли до тих самих висновків."},
{t:"66 днів, не 21", s:"«21 день на звичку» — міф із книжки пластичного хірурга 1960-х. Дослідження Лондонського університету 2009 року дало середню цифру 66 днів, з розкидом від 18 до 254."},

async function connect(){

  try{
    const [app,fs] = await Promise.all([import(SDK+"firebase-app.js"), import(SDK+"firebase-firestore.js")]);
    const a = app.initializeApp(FB);
    const db = fs.initializeFirestore(a,{ localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()}) });
    return { db, doc:fs.doc, getDoc:fs.getDoc, setDoc:fs.setDoc };
  }catch(e){ console.warn("cloud off:",e); return null; }
}
function normalize(data){
  S = data || {};
  S.start  ||= today();
  S.modes  ||= DEFAULT_MODES.map(m=>({...m}));
  S.habits ||= DEFAULT_HABITS.map(h=>({...h}));
  S.habits.forEach(h=>{ if(!S.modes.some(m=>m.id===h.mode)) h.mode=S.modes[0].id; });
  if(!S.modes.some(m=>m.id===S.mode)) S.mode=S.modes[0].id;
  const guess=re=>S.habits.find(h=>re.test(h.name)||re.test(h.id))?.id||null;
  S.int ||= { steps:{habit:guess(/крок|ход|walk|step/i),goal:10000}, social:{habit:guess(/соц|телефон|phone|інст|tiktok/i),limit:10,on:false,since:""} };
  S.set ||= { facts:true, vibe:true };
  S.ach ||= {}; S.history ||= []; S.round ||= 1;
  S.tags   ||= DEFAULT_TAGS.slice();
  S.goals  ||= { short:[], mid:[], long:[] };
  S.days   ||= {};
  S.ms     ||= {};
  S.lastFact ||= "";
}

function parseSteps(v){
  if(typeof v==="number") return Math.round(v);
  const s=String(v).replace(/[\s\u00a0\u202f]/g,""), m=s.match(/^(\d+)(?:[.,]\d+)?$/);

function ask({title,value="",del=false,ok="Зберегти",placeholder="",extra=null,desc="",confirm=false,danger=false,delLabel="Видалити"}){

      bOk.onclick=bDel.onclick=inp.onkeydown=ex.onkeydown=w.querySelector(".sheet-bg").onclick=null; res(r); };
    bOk.onclick=()=>{ if(confirm) return close({value:true}); const v=inp.value.trim(); close(v?{value:v,extra:[...ex.value.trim()].slice(0,2).join("")}:null); };

const dayOf = d => (S.days[d] ||= {done:{},mood:0,tags:[],note:""});
function dateKey(i){ const d=new Date(S.start+"T00:00:00"); d.setDate(d.getDate()+i); return iso(d); }
function dayIndex(k){ const a=new Date(S.start+"T00:00:00"), b=new Date((k||today())+"T00:00:00"); return Math.round((b-a)/864e5); }
const isRest = k => !!S.days[k]?.rest;
const habitsOf = m => S.habits.filter(h=>h.mode===m);
const H = () => habitsOf(S.mode);
const modeName = (m=S.mode) => S.modes.find(x=>x.id===m)?.name||"";
function autoOf(h,key){
  return null;
  const d=S.days[key], I=S.int;
  if(I.steps.habit===h.id && d?.steps!=null) return {kind:"steps", done:d.steps>=I.steps.goal, v:d.steps, max:I.steps.goal};
  if(I.social.habit===h.id && I.social.on && I.social.since && key>=I.social.since){ const o=d?.opens||0; return {kind:"social", done:o<=I.social.limit, v:o, max:I.social.limit}; }
  return null;
}
function isDone(h,key){ const a=autoOf(h,key); return a ? a.done : !!S.days[key]?.done?.[h.id]; }
function doneCount(key,m=S.mode){ return habitsOf(m).filter(h=>isDone(h,key)).length; }
function ratio(key,m=S.mode){ const n=habitsOf(m).length; return n ? doneCount(key,m)/n : 0; }
function headDate(){ const d=new Date(), w=d.toLocaleDateString("uk-UA",{weekday:"long"});
  return `<span class="wd">${w[0].toUpperCase()+w.slice(1)}, </span>`+d.toLocaleDateString("uk-UA",{day:"numeric",month:"long"}); }
const human = k => new Date(k+"T00:00:00").toLocaleDateString("uk-UA",{day:"numeric",month:"short"});
function streak(m=S.mode){
  let n=0, idx=dayIndex();
  for(let i=idx;i>=0;i--){ const k=dateKey(i); if(isRest(k)) continue; if(ratio(k,m)===1) n++; else if(i!==idx) break; }
  return n;
}
function bestStreak(m=S.mode){
  let best=0,n=0, idx=dayIndex();
  for(let i=0;i<=idx;i++){ const k=dateKey(i); if(isRest(k)) continue; if(ratio(k,m)===1){ n++; best=Math.max(best,n); } else if(i!==idx) n=0; }
  return best;
}
function habitStreak(h){
  let n=0, idx=dayIndex();
  for(let i=idx;i>=0;i--){ const k=dateKey(i); if(isRest(k)) continue; if(isDone(h,k)) n++; else if(i!==idx) break; }
  return n>1?n:0;
}

/* ═══ тиждень ═══ */
function weekStats(w){
  const idx=dayIndex(), from=w*7, to=Math.min(from+6,idx);
  let full=0,sum=0,n=0,moods=[],tags={};
  for(let i=from;i<=to;i++){
    const k=dateKey(i), d=S.days[k];
    if(d?.mood) moods.push(d.mood); (d?.tags||[]).forEach(x=>tags[x]=(tags[x]||0)+1);
    if(isRest(k)) continue;
    const r=ratio(k); n++; sum+=r; if(r===1) full++;
  }
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return { w, from, to, n, full, avg:n?sum/n:0, mood:moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0, top };
}
function weekCells(w){
  const idx=dayIndex(), from=w*7; let out="";
  for(let i=from;i<from+7;i++){
    if(i>idx||i>99){ out+='<i></i>'; continue; }
    const k=dateKey(i);
    if(isRest(k)){ out+='<i style="background:repeating-linear-gradient(135deg,var(--soft) 0 3px,transparent 3px 7px)"></i>'; continue; }
    const r=ratio(k), c0=col(r);
    out+=`<i style="background:${r===0?"rgba(255,69,58,.16)":grad(c0)};opacity:${r===0?1:(.35+.65*r)}"></i>`;
  }
  return out;
}

  $("#weekStrip").innerHTML=`<div class="week"><div class="week-top"><span>Тиждень <b>${w+1}</b></span>
    <span>${st.full} з 7 повних${st.mood?` · настрій <b>${st.mood.toFixed(1)}</b>`:""}</span></div><div class="week-row">${weekCells(w)}</div></div>`;
}

function stats(){
  const idx=dayIndex(); let days=0,sum=0,full=0;
  for(let i=0;i<=idx;i++){ const k=dateKey(i); if(isRest(k)) continue; days++; const r=ratio(k); sum+=r; if(r===1) full++; }
  return {days,avg:days?sum/days:0,full,best:Math.max(bestStreak(),streak())};
}
function habitPct(h){ let n=0,d=0; for(let i=0;i<=dayIndex();i++){ const k=dateKey(i); if(isRest(k)) continue; n++; if(isDone(h,k)) d++; } return n?d/n:0; }
function corr(h){
  let a=[],b=[];
  for(let i=0;i<=dayIndex();i++){ const k=dateKey(i), d=S.days[k]; if(!d?.mood) continue; (isDone(h,k)?a:b).push(d.mood); }
  if(a.length<2||b.length<2) return null;
  const avg=x=>x.reduce((p,q)=>p+q,0)/x.length; return {with:avg(a),without:avg(b),diff:avg(a)-avg(b)};
}
function spark(){
  const idx=dayIndex(), W=340, H=90, pts=[];
  for(let i=0;i<=idx;i++){ const m=S.days[dateKey(i)]?.mood; if(m) pts.push([i,m]); }
  if(pts.length<2) return `<div class="empty">Графік настрою з'явиться після двох оцінених днів</div>`;
  const span=Math.max(idx,6), x=i=>8+(i/span)*(W-16), y=m=>H-8-((m-1)/9)*(H-16);
  const path=pts.map((p,k)=>(k?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="3.5" fill="${col(p[1]/10)}"/>`).join("");
  const avg=(pts.reduce((s,p)=>s+p[1],0)/pts.length).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="${col(pts[0][1]/10)}"/><stop offset="1" stop-color="${col(pts[pts.length-1][1]/10)}"/></linearGradient></defs>
    <path d="${path}" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>
    <div class="spark-cap"><span>день 1</span><span>середній настрій <b style="color:var(--text)">${avg}</b></span><span>день ${idx+1}</span></div>`;
}
function miniGrid(h){
  const idx=dayIndex(); let out="";
  for(let i=0;i<100;i++){
    const k=dateKey(i);
    if(i>idx) out+='<i style="opacity:.4"></i>';
    else if(isRest(k)) out+='<i style="background:repeating-linear-gradient(135deg,var(--soft) 0 3px,transparent 3px 7px)"></i>';
    else if(isDone(h,k)) out+=`<i style="background:${grad("var(--green)")}"></i>`;
    else out+='<i style="background:rgba(255,69,58,.18)"></i>';
  }
  return out;
}
function drawStats(){
  const box=$("#stats"), st=stats();
  let html=`<div class="kpis">
    <div class="kpi"><b>${Math.round(st.avg*100)}%</b><span>виконання</span></div>
    <div class="kpi"><b>${st.full}</b><span>повних днів</span></div>
    <div class="kpi"><b>${st.best}</b><span>найкраща серія</span></div></div>
    <p class="h">Настрій</p>${spark()}
    <p class="h">Звички · ${esc(modeName())}</p>`;
  if(!H().length) html+='<div class="empty">У цьому режимі ще немає звичок</div>';
  html+=H().map(h=>{
    const p=habitPct(h), c=corr(h);
    const cr = c ? `<div class="corr">У дні з цим настрій <b>${c.with.toFixed(1)}</b>, без — <b>${c.without.toFixed(1)}</b>
      <span class="${c.diff>=0?"up":"dn"}">${c.diff>=0?"+":""}${c.diff.toFixed(1)}</span></div>` : "";
    return `<div class="srow${openStat===h.id?" open":""}" data-id="${h.id}">
      <button class="srow-h">${h.emoji?`<span class="emo">${esc(h.emoji)}</span>`:""}<span class="nm">${esc(h.name)}</span><span class="pct" style="color:${col(p)}">${Math.round(p*100)}%</span></button>
      <div class="srow-bar"><i style="width:${p*100}%;background:${grad(col(p))}"></i></div>
      <div class="mini">${miniGrid(h)}</div>${openStat===h.id?cr:""}</div>`;
  }).join("");
  const tags={}; for(let i=0;i<=dayIndex();i++) (S.days[dateKey(i)]?.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1);
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,6), mx=top[0]?.[1]||1;
  if(top.length) html+=`<p class="h" style="margin-top:26px">Що було найчастіше</p>`+top.map(([t,n])=>
    `<div class="tagbar"><span class="t">${esc(t)}</span><span class="b"><i style="width:${n/mx*100}%"></i></span><span class="c">${n}</span></div>`).join("");
  box.innerHTML=html;
  box.querySelectorAll(".srow-h").forEach(b=>b.onclick=()=>{ const id=b.parentElement.dataset.id; openStat=openStat===id?null:id; buzz(); drawStats(); });
}

/* ═══ картинка для сторіс ═══ */
function renderCard(){
  const W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d");
  const idx=dayIndex(), rt=ratio(today());
  const cs=70, gap=8, GW=10*cs+9*gap, L=(W-GW)/2, R=L+GW, gy=392;
  g.fillStyle="#000"; g.fillRect(0,0,W,H);
  const rg=g.createRadialGradient(180,120,0,180,120,900); rg.addColorStop(0,"rgba(255,179,64,.30)"); rg.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=rg; g.fillRect(0,0,W,H);
  const rg2=g.createRadialGradient(W-100,H-200,0,W-100,H-200,800); rg2.addColorStop(0, rt ? colC(rt,.22) : "rgba(110,110,128,.22)"); rg2.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=rg2; g.fillRect(0,0,W,H);
  const F='"Inter",-apple-system,"Segoe UI",Roboto,sans-serif';
  g.textBaseline="alphabetic"; g.textAlign="left";
  g.fillStyle="#fff"; g.font=`800 190px ${F}`;
  const num=String(Math.min(idx+1,100)); g.fillText(num,L-8,262);
  const nw=g.measureText(num).width;
  g.fillStyle="rgba(235,235,245,.6)"; g.font=`500 44px ${F}`; g.fillText("зі 100 днів",L+nw+14,262);
  g.fillStyle="rgba(235,235,245,.4)"; g.font=`500 34px ${F}`;
  g.fillText(new Date().toLocaleDateString("uk-UA",{day:"numeric",month:"long"})+(S.modes.length>1?"  ·  "+modeName():""),L,325);
  for(let i=0;i<100;i++){
    const k=dateKey(i), r=ratio(k), x=L+(i%10)*(cs+gap), y=gy+Math.floor(i/10)*(cs+gap);
    g.fillStyle = i>idx ? "rgba(255,255,255,.045)" : (isRest(k) ? "rgba(255,255,255,.09)" : (r===0 && i<idx ? "rgba(255,69,58,.18)" : "rgba(255,255,255,.07)"));
    rr(g,x,y,cs,cs,11); g.fill();
    if(r>0){ const hgt=cs*r; g.fillStyle=colC(r); rr(g,x,y+cs-hgt,cs,hgt,11); g.fill(); }
    if(i===idx){ g.strokeStyle="#fff"; g.lineWidth=4; rr(g,x-7,y-7,cs+14,cs+14,15); g.stroke(); }
  }
  const s=streak(), fy=gy+10*cs+9*gap+118;
  g.fillStyle="#34C759"; g.font=`700 64px ${F}`; g.fillText(String(s),L,fy);
  const sw=g.measureText(String(s)).width;
  g.fillStyle="rgba(235,235,245,.55)"; g.font=`500 34px ${F}`; g.fillText(s===1?"день поспіль":"днів поспіль",L+sw+16,fy);
  g.textAlign="right";
  g.fillStyle="#FFB340"; g.font=`800 60px ${F}`; g.fillText("100",R,fy);
  g.fillStyle="rgba(235,235,245,.4)"; g.font=`500 30px ${F}`; g.fillText(nick,R,fy-68);
  return cv;
}
function shareCard(){
  const url=renderCard().toDataURL("image/png"), name=`100-day-${dayIndex()+1}.png`;
  const bin=atob(url.split(",")[1]), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const file=new File([u8],name,{type:"image/png"});
  const showImg=()=>overlay({label:"Сторіс", title:"", btn:"Закрити",
    html:`<img src="${url}" alt="" style="width:100%;border-radius:18px;display:block;margin-bottom:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)">
      <div class="stat">${"ontouchstart" in window ? "Утримай картинку, щоб зберегти" : `<a href="${url}" download="${name}" style="color:var(--accent);font-weight:550">Завантажити PNG</a>`}</div>`});
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
  if(!mobile){
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    flash("завантажено "+name); return;
  }
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(e=>{ if(e?.name!=="AbortError") showImg(); }); return;
  }
  showImg();
}
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
$("#share").onclick=()=>{ buzz(); try{ shareCard(); }catch(e){ flash("не вдалося: "+e.message); } };

let tx=0,ty=0,tt=0;
document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); },{passive:true});
document.addEventListener("touchend",e=>{
  if($("#app").hidden || !$("#sheet").hidden || !$("#fact").hidden) return;
  if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<60 || Math.abs(dy)>50 || Date.now()-tt>600) return;

  const n=cur.n+(dx<0?1:-1); if(n>=0&&n<=3) tab(n);

/* ═══ ачівки ═══ */
function achCtx(){
  const idx=Math.min(dayIndex(),99), ms=S.modes.filter(m=>habitsOf(m.id).length), t=today(), I=S.int.social;
  let full=0,moods=0,notes=0,steps=0,back=false,early=false,balance=false,perfect=false,detox=false,prevZero=false;
  for(let i=0;i<=idx;i++){
    const k=dateKey(i), d=S.days[k]||{}, rs=ms.map(m=>ratio(k,m.id));
    const anyFull=rs.some(r=>r===1), allZero=rs.length>0 && rs.every(r=>r===0) && !isRest(k);
    if(anyFull){ full++; if(prevZero) back=true; if(d.fullAt!=null && d.fullAt<12) early=true; if(d.mood===10) perfect=true; }
    if(rs.length>1 && rs.every(r=>r===1)) balance=true;
    if(d.mood) moods++;
    if((d.note||"").trim().length>2) notes++;
    if(d.steps) steps=Math.max(steps,d.steps);
    if(I.on && I.since && k>=I.since && k<t && (d.opens||0)<=3) detox=true;
    prevZero=allZero;
  }
  const best=Math.max(0,...ms.map(m=>Math.max(bestStreak(m.id),streak(m.id))));
  return {best,full,day:dayIndex()+1,moods,notes,steps,back,early,balance,perfect,detox,again:S.history.length>0};
}
const TIERS=[7,30,100];
function habitTotal(h){
  let n=0; const idx=Math.min(dayIndex(),99);
  for(let i=0;i<=idx;i++){ const k=dateKey(i); if(!isRest(k) && isDone(h,k)) n++; }
  return n;
}
function personalAch(){
  const out=[];
  S.habits.forEach(h=>{ const n=habitTotal(h);
    TIERS.forEach((t,j)=>out.push({id:`h:${h.id}:${t}`, h, tier:j+1, goal:t, n,
      e:h.emoji||"✓", t:`${h.name} · ${t} днів`, d:`${t} днів з цією звичкою`, p:()=>n/t})); });
  return out;
}

    S.modes.forEach(m=>{ habitsOf(m.id).forEach(hb=>{
      const tiles=pa.filter(a=>a.h===hb), n=tiles[0].n;
      html+=`<div class="hach-h">${hb.emoji?esc(hb.emoji)+" ":""}${esc(hb.name)}<small>${n} ${n%10===1&&n%100!==11?"день":(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?"дні":"днів"}${S.modes.length>1?" · "+esc(m.name):""}</small></div><div class="achs" style="margin-bottom:18px">`;
      html+=tiles.map(a=>{ const ok=!!S.ach[a.id], p=Math.min(1,a.n/a.goal);
        return `<div class="ach ${ok?"got":"lock"}" data-tier="${a.tier}"><div class="e">${esc(a.e)}</div><div class="t">${a.goal} днів</div>
          <div class="d">${ok?"отримано":Math.min(a.n,a.goal)+" / "+a.goal}</div>${!ok&&p>0?`<div class="pb"><i style="width:${p*100}%"></i></div>`:""}</div>`; }).join("");
      html+=`</div>`;
    }); });
    html+=`<div style="height:12px"></div>`;
  }
  html+=`
    <p class="h">Режими</p><div class="pcard">`;
  html+=S.modes.map(m=>`<div class="prow"><div>${esc(m.name)}<small>${habitsOf(m.id).length} звичок · серія ${streak(m.id)}</small></div>
      <button class="edit" data-mode="${m.id}">Змінити</button></div>`).join("");
  if(S.modes.length<4) html+=`<div class="prow"><button class="edit" id="pAddMode">+ Додати режим</button></div>`;
  html+=`</div>
    </div>
    <p class="h" style="margin-top:22px">Налаштування</p><div class="pcard">
      <div class="prow"><div>Темна тема</div><button class="tog${document.documentElement.dataset.theme!=="light"?" on":""}" id="pTheme"></button></div>
      <div class="prow"><div>Факт дня зранку</div><button class="tog${S.set.facts!==false?" on":""}" id="pFacts"></button></div>
      <div class="prow"><div>Вібрація</div><button class="tog${S.set.vibe!==false?" on":""}" id="pVibe"></button></div>
      <div class="prow"><div>Синхронізація<small>${cloud?"Firebase, ті самі дані на всіх пристроях":"вимкнена, дані лише на цьому пристрої"}</small></div>
        <span style="color:${cloud?"var(--green)":"var(--faint)"};font-size:14px;font-weight:600">${cloud?"увімкнена":"офлайн"}</span></div>
    </div>`;
  const top=$("#profTop"); top.innerHTML=html;

  top.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.copy)));
  top.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>editMode(S.modes.find(m=>m.id===b.dataset.mode)));
  $("#pAddMode")?.addEventListener("click",addMode);
  const tg=(id,fn)=>{ const el=$(id); if(el) el.onclick=()=>{ buzz(); fn(); el.classList.toggle("on"); }; };
  tg("#pTheme",()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light"));
  tg("#pFacts",()=>{ S.set.facts=S.set.facts===false; save(); });
  tg("#pVibe",()=>{ S.set.vibe=S.set.vibe===false; save(); });
  tg("#pSocOn",()=>{ I.social.on=!I.social.on; if(I.social.on && !I.social.since) I.social.since=today(); save(); drawGrid(); });
  const num=(id,fn)=>{ const el=$(id); if(el) el.onchange=()=>{ const v=parseInt(el.value)||0; if(v>0){ fn(v); save(); drawGrid(); } }; };
  num("#pStepsG",v=>I.steps.goal=v); num("#pSocL",v=>I.social.limit=v);
  const pick=(id,fn)=>{ const el=$(id); if(el) el.onchange=()=>{ fn(el.value||null); save(); drawGrid(); }; };
  pick("#pStepsH",v=>I.steps.habit=v); pick("#pSocH",v=>I.social.habit=v);

  const ar=$("#profArchive");
  ar.innerHTML = S.history.length ? `<p class="h">Попередні челенджі</p>`+S.history.map((c,n)=>{
    const m=c.modes[0]||{r:[]}, cells=Array.from({length:100},(_,i)=>{ const r=m.r[i];
      return r==null?'<i style="opacity:.35"></i>':`<i style="background:${r===0?"rgba(255,69,58,.18)":grad(col(r))}"></i>`; }).join("");
    return `<div class="arch"><div class="arch-top"><span>Челендж <b>${S.history.length-n}</b> · ${human(c.start)} – ${human(c.end)}</span>
      <span>${c.days} дн. · серія <b>${Math.max(...c.modes.map(x=>x.best),0)}</b></span></div><div class="mini">${cells}</div></div>`;
  }).join("") : "";
}
$("#restart").onclick=async()=>{
  const r=await ask({title:"Почати челендж заново",confirm:true,danger:true,ok:"Почати з сьогодні",
    desc:"Поточна сітка піде в архів профілю. Звички, режими, цілі й ачівки залишаться, оцінки дня й нотатки очистяться."});
  if(!r) return;
  const n=Math.min(dayIndex()+1,100);
  S.history.unshift({start:S.start,end:today(),days:n,modes:S.modes.filter(m=>habitsOf(m.id).length).map(m=>({name:m.name,best:bestStreak(m.id),
    r:Array.from({length:n},(_,i)=>isRest(dateKey(i))?null:+ratio(dateKey(i),m.id).toFixed(2))}))});
  S.start=today(); S.days={}; S.ms={}; S.lastWeek=0; S.round=(S.round||1)+1;
  save(); firstGrid=true; lastStreak=-1; buzz([12,40,18]); tab(0); refresh(); flash("новий челендж, день 1");
};
$("#logout").onclick=async()=>{
  const r=await ask({title:"Вийти з ніка",confirm:true,ok:"Вийти",desc:cloud?"Дані лишаються в хмарі, повернешся тим самим ніком.":"Синхронізації немає, тож дані лишаються лише в цьому браузері."});
  if(!r) return; try{ localStorage.removeItem("h100:last"); }catch(e){} location.reload();
};

/* ═══ старт ═══ */
const nickIn=$("#nick"), enter=$("#enter");
nickIn.onkeydown=e=>{ if(e.key==="Enter") start(); }; enter.onclick=start;
async function start(){
  nick=nickIn.value.trim().toLowerCase().replace(/[^a-zа-яіїєґ0-9_-]/gi,"");
  if(nick.length<2){ nickIn.focus(); nickIn.style.borderColor="var(--red)"; setTimeout(()=>nickIn.style.borderColor="",1200); return; }
  try{ localStorage.setItem("h100:last",nick); }catch(e){}
  enter.textContent="…";
  await load(); curDate=today();
  $("#gate").classList.add("hide"); setTimeout(()=>$("#gate").remove(),500);
  $("#app").hidden=false; $("#who").textContent=nick[0].toUpperCase(); avatarDot();
  $("#date").innerHTML=headDate();
  lastStreak=-1; drawGrid(); tab(0);
  try{ document.fonts?.load('800 100px "Inter"'); document.fonts?.load('500 40px "Inter"'); }catch(e){}
  setTimeout(morning,700);
  setTimeout(()=>{ checkAch(); pullExt(); },1300);
}
try{ const last=localStorage.getItem("h100:last"); if(last) nickIn.value=last; }catch(e){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
